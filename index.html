<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Manning Guide von mamu hospitality: Personalbedarf eines Hotels aus einem Tagesdienstplan für das ganze Jahr berechnen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232e2c2d'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23f5f5f5' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Manning Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: ruhige Arbeitsfläche auf Primärgrau, Kennzahlen-Leiste im Stil der mamu-Markenkern-Spalten (Haarlinie links, Zahl, Label), darunter Tabs mit Dienstplan-Gantt */
:root{
  --bg:#f5f5f5;         /* Primäre Hintergrundfarbe */
  --surface:#fbfbfa;
  --sunk:#ecebe8;
  --olive:#77704a;      /* Sekundäre Hintergrundfarbe – Signalfläche */
  --on-olive:#ffffff;
  --terra:#b18e72;      /* Akzent: Zahlen, Linien */
  --green:#455246;      /* Akzent: Icons, kleine Elemente */
  --ink:#2e2c2d;        /* Schriftfarbe */
  --ink-2:#5c595a;
  --ink-3:#8a8687;
  --line:#9b9599;       /* Trennstriche */
  --hair:#dedcd8;
  --bar-mgnt:#455246;
  --bar-staff:#b18e72;
  --bar-ext:#9b9599;
  --focus:#77704a;
  --warn:#9a5b1e;
  --font-title:"Lato","Helvetica Neue",Arial,sans-serif;
  --font-text:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-num:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1c1b;--surface:#252423;--sunk:#2d2b2a;--olive:#5d5839;--on-olive:#f7f5ef;
  --terra:#d8a274;--green:#8fb59a;--ink:#ecebe8;--ink-2:#bdbab5;--ink-3:#8d8984;--line:#6d686b;--hair:#3a3836;
  --bar-mgnt:#5f8f6c;--bar-staff:#d8a274;--bar-ext:#7d787b;--focus:#d8a274;--warn:#e0a060;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1c1b;--surface:#252423;--sunk:#2d2b2a;--olive:#5d5839;--on-olive:#f7f5ef;
  --terra:#d8a274;--green:#8fb59a;--ink:#ecebe8;--ink-2:#bdbab5;--ink-3:#8d8984;--line:#6d686b;--hair:#3a3836;
  --bar-mgnt:#5f8f6c;--bar-staff:#d8a274;--bar-ext:#7d787b;--focus:#d8a274;--warn:#e0a060;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:13px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:20px 64px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-title);font-weight:700;margin:0;text-wrap:balance}

/* top bar */
.top{display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{width:96px;height:auto;color:var(--ink);flex:none}
.brand .sep{width:1px;height:26px;background:var(--line)}
.brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.top .spacer{flex:1}
.proj-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status[data-s="saved"] i{background:var(--green)}
.status[data-s="saving"] i{background:var(--terra)}
.status[data-s="error"] i{background:var(--warn)}

select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:5px 8px;min-width:0}
select:hover,input:hover{border-color:var(--line)}
.btn{background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--warn);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.icon-btn{background:none;border:0;padding:3px 5px;cursor:pointer;color:var(--ink-3);border-radius:3px;font-size:14px;line-height:1}
.icon-btn:hover{color:var(--ink);background:var(--sunk)}

/* project head */
.phead{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;padding-block:26px 22px}
.phead .pname{flex:1 1 360px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pname input{font-family:var(--font-title);font-size:clamp(22px,3vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:0;border-bottom:1px solid transparent;background:transparent;width:100%;padding:2px 0;border-radius:0}
.pname input:hover,.pname input:focus{border-bottom-color:var(--line);outline:none}
.meta{display:flex;gap:20px;flex-wrap:wrap}
.meta label{display:flex;flex-direction:column;gap:2px}
.meta input,.meta select{width:170px}

/* KPI columns – brand "Markenkern" device */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px 28px;padding-block:6px 26px}
.kpi{border-left:1px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--font-num);font-size:36px;line-height:1.05;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--ink-3);font-weight:400;margin-left:4px}
.kpi .l{font-weight:700;font-size:12.5px}
.kpi .d{font-size:11.5px;color:var(--ink-2)}
.kpi.lead .v{color:var(--terra)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;font-family:var(--font-title);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--terra)}
.tab:hover{color:var(--ink)}

/* schedule toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--hair);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:8px;border-radius:2px;display:inline-block}
.sw.m{background:var(--bar-mgnt)}.sw.s{background:var(--bar-staff)}
.sw.p{background:repeating-linear-gradient(135deg,var(--bar-staff) 0 3px,transparent 3px 5px);border:1px solid var(--bar-staff)}
.sw.x{border:1px dashed var(--bar-ext);background:transparent}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}

/* division + department */
.div-h{display:flex;align-items:baseline;gap:14px;margin:30px 0 10px;flex-wrap:wrap}
.div-h h2{font-size:17px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.div-h .sum{font-size:12px;color:var(--ink-2)}
.div-h .sum b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-size:14px}
.dept{background:var(--surface);border:1px solid var(--hair);border-radius:4px;margin-bottom:14px}
.dept-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.dept-h .dn{font-family:var(--font-title);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;border:0;background:transparent;padding:2px 0;border-bottom:1px solid transparent;border-radius:0;width:min(320px,100%)}
.dept-h .dn:hover,.dept-h .dn:focus{border-bottom-color:var(--line);outline:none}
.dstats{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.dstats b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-size:14px;margin-left:3px}
.dstats .ideal b{color:var(--terra)}
.dept-h .grow{flex:1}
.dept-h select{font-size:11.5px;padding:3px 6px}
.scroll{overflow-x:auto}
table.sched{border-collapse:collapse;width:100%;min-width:1120px}
.sched th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--hair);white-space:nowrap}
.sched td{padding:3px 6px;border-bottom:1px solid var(--hair);vertical-align:middle}
.sched tr:last-child td{border-bottom:0}
.sched td.c-name input{width:100%;border-color:transparent;background:transparent}
.sched td.c-name input:hover,.sched td.c-name input:focus{border-color:var(--hair);background:var(--bg)}
.sched select{border-color:transparent;background:transparent;padding:3px 4px}
.sched select:hover,.sched select:focus{border-color:var(--hair);background:var(--bg)}
.c-name{width:220px}.c-emp{width:130px}.c-start{width:78px}.c-end{width:62px}.c-hrs{width:48px;text-align:right}.c-lock{width:44px;text-align:center}.c-act{width:58px;text-align:right;white-space:nowrap}
.c-end,.c-hrs{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.c-end sup{color:var(--terra);font-size:9px;margin-left:1px}
.tl{position:relative;height:16px;min-width:480px;background:
  repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/24 - 1px),var(--hair) calc(100%/24 - 1px),var(--hair) calc(100%/24))}
.tl .b{position:absolute;top:3px;bottom:3px;border-radius:2px}
.tl .b.mgnt{background:var(--bar-mgnt)}
.tl .b.ft{background:var(--bar-staff)}
.tl .b.pt,.tl .b.ptr{background:repeating-linear-gradient(135deg,var(--bar-staff) 0 3px,transparent 3px 5px);border:1px solid var(--bar-staff)}
.tl .b.ext{border:1px dashed var(--bar-ext);background:transparent}
.hours{display:flex;min-width:480px;font-family:var(--font-num);font-size:10px;color:var(--ink-3);letter-spacing:0;text-transform:none;font-weight:400}
.hours span{flex:1;text-align:left}
.cov{display:flex;height:12px;min-width:480px;gap:0}
.cov i{flex:1;background:var(--terra)}
tr.auto td{background:var(--sunk)}
tr.auto .c-name{font-style:italic;color:var(--ink-2)}
.badge{display:inline-block;font-family:var(--font-num);font-size:11px;background:var(--ink);color:var(--bg);border-radius:10px;padding:0 7px;margin-left:6px;font-style:normal}
.dept-f{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--hair);flex-wrap:wrap;align-items:center}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn)}
.add-dept{margin:4px 0 6px}

/* parameters */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:18px 20px;min-width:0}
.panel h3{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.panel .hint{color:var(--ink-2);font-size:12px;margin:0 0 14px;max-width:62ch}
.ptable{width:100%;border-collapse:collapse}
.ptable th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--hair)}
.ptable td{padding:4px 6px;border-bottom:1px solid var(--hair)}
.ptable input[type=number]{width:72px;text-align:right;font-family:var(--font-num)}
.ptable input[type=text]{width:100%}
.ptable td.out{white-space:nowrap;font-family:var(--font-num);color:var(--ink-2);text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:3px}
.field span{font-size:11.5px;color:var(--ink-2)}
.field input{font-family:var(--font-num);width:100%}
.formula{margin-top:14px;padding:10px 12px;background:var(--sunk);border-radius:3px;font-size:12px;color:var(--ink-2)}
.formula b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* results */
.olive{background:var(--olive);color:var(--on-olive);border-radius:4px;padding:22px 24px;margin-bottom:22px}
.olive h3{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;margin-bottom:14px}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px 24px}
.mix>div{border-left:1px solid color-mix(in srgb,var(--on-olive) 50%,transparent);padding-left:10px}
.mix .v{font-family:var(--font-num);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.mix .l{font-size:11.5px;opacity:.85}
.chart-h{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-wrap{position:relative}
#covChart{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;padding:7px 10px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.tip b{font-family:var(--font-num);font-size:14px;font-weight:500}
table.res{border-collapse:collapse;width:100%;min-width:760px}
.res th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.res th:first-child,.res td:first-child{text-align:left}
.res td{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.res td:first-child{font-family:var(--font-text)}
.res tr.dv td{font-family:var(--font-title);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;padding-top:16px;border-bottom-color:var(--line)}
.res tr.dv td.n{font-family:var(--font-num);letter-spacing:0;font-size:13px}
.res tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0;font-size:14px}
.res tr.tot td:first-child{font-family:var(--font-title);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.res td.bars{width:30%;min-width:180px}
.tw{display:flex;flex-direction:column;gap:2px}
.tw i{display:block;height:5px;border-radius:0 2px 2px 0}
.tw i.a{background:var(--bar-mgnt)}.tw i.b{background:var(--bar-staff)}
.res td.ideal{color:var(--terra)}

/* method */
.method{max-width:780px;display:flex;flex-direction:column;gap:26px}
.method section{border-left:1px solid var(--line);padding-left:16px}
.method h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.method p{margin:0 0 8px;max-width:68ch;color:var(--ink-2)}
.method ol{margin:0;padding-left:18px;color:var(--ink-2)}
.method li{margin-bottom:4px}
.method code{font-family:var(--font-num);background:var(--sunk);padding:1px 6px;border-radius:3px;color:var(--ink);font-size:12.5px}

.empty{padding:60px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:560px}
.empty p{color:var(--ink-2);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:3px;font-size:12.5px;z-index:9;max-width:90vw}
.foot{margin-top:48px;padding-top:14px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){.kpi .v{font-size:30px}.brand svg{width:80px}.meta input,.meta select{width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: project parameters, new-project dialog, draggable shifts */
.pparams{display:flex;flex-direction:column;gap:8px;padding-block:0 24px}
.pp-row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.pp{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-2)}
.pp-sel{font-size:13.5px;padding:6px 8px}
.ptable td input[data-tier]{width:72px;text-align:right;font-family:var(--font-num)}
.pp input{width:96px;font-family:var(--font-num);font-size:15px}
.pp.res{border-left:1px solid var(--line);padding-left:12px}
.pp.res b{font-family:var(--font-num);font-weight:500;font-size:24px;line-height:1.1;color:var(--terra)}
.pp.res small{font-family:var(--font-num);color:var(--ink-3);font-size:11px}
.newdlg{margin-top:14px;max-width:760px}
.np-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 16px}
.np-wide{grid-column:1/-1}.np-wide input{font-family:var(--font-text)!important}
.np-base{grid-column:1/-1;border:0;padding:0;margin:0;display:flex;gap:18px;flex-wrap:wrap}
.np-base legend{font-size:11.5px;color:var(--ink-2);padding:0;margin-bottom:4px}
.c-chk{width:44px;text-align:center}
.c-end{width:96px;white-space:nowrap}
.c-end .nd{color:var(--terra);font-size:9.5px;margin-left:1px;font-family:var(--font-num)}
.c-hrs{cursor:help}
.tl{height:22px}
.tl .b{top:5px;bottom:5px;cursor:grab;touch-action:none}
.tl .b .hl,.tl .b .hr{position:absolute;top:-5px;bottom:-5px;width:10px;cursor:ew-resize;touch-action:none}
.tl .b .hl{left:-5px}.tl .b .hr{right:-5px}
.tl .b .hl::after,.tl .b .hr::after{content:"";position:absolute;top:3px;bottom:3px;left:4px;width:2px;border-radius:1px;background:var(--ink);opacity:0;transition:opacity .12s}
.tl:hover .b .hl::after,.tl:hover .b .hr::after,.tl.dragging .b .hl::after,.tl.dragging .b .hr::after{opacity:.55}
.tl.dragging .b{cursor:grabbing;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--focus)}
body.is-dragging{cursor:grabbing;user-select:none}
.dtip{position:absolute;bottom:calc(100% + 2px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-num);font-size:11px;padding:2px 7px;border-radius:3px;white-space:nowrap;pointer-events:none;z-index:4}
.drag-hint{color:var(--ink-3)}
.c-tl{position:relative}

/* v4: outlets */
.outlets{grid-column:1/-1}
.outlet{border-top:1px solid var(--hair);padding-top:14px;margin-top:14px}
.ol-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ol-name{font-family:var(--font-title);font-weight:700;text-transform:uppercase;letter-spacing:.06em;width:min(240px,100%)}
.ol-note{flex:1 1 220px;min-width:0}
.ol-sum{font-size:12px;color:var(--ink-2)}.ol-sum b{font-size:15px;font-weight:500;color:var(--terra)}
table.otable{border-collapse:collapse;width:100%;min-width:900px}
.otable th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--hair)}
.otable td{padding:4px 6px;border-bottom:1px solid var(--hair);vertical-align:middle}

  IT:{name:'Italien',ref:'D.Lgs. 66/2003 Art. 8',op:'>',paid:false,tiers:[{h:6,m:10}],note:'Bei mehr als 6 Stunden eine Pause; Dauer laut Kollektivvertrag (CCNL), gesetzlich mindestens 10 Minuten.'},

};
const brkPreset=c=>{const b=BRK[c]||BRK.AT;return {country:BRK[c]?c:'AT',op:b.op,paid:b.paid,tiers:b.tiers.map(t=>({...t}))}};
const defF=e=>(e==='mgnt'||e==='ext')?0:1;
const roleOf=e=>(e==='ft'||e==='pt'||e==='ptr')?'staff':e;   // 7-Tage-Bedarf (FTE-Haken) als Startwert

function newProject(fromTpl,opt){
  opt=opt||{};
  const p={id:uid(),name:opt.name||(fromTpl?'Vorlage Stadthotel':'Neues Projekt'),status:'Entwurf',author:'Max Murmann',created:new Date().toISOString().slice(0,10),
    updatedAt:Date.now(),v:2,
    ops:fromTpl?[
      {o:'Main Restaurant',d:'MO – SU',h:'07:00 – 11:00 / 12:30 – 14:30 / 18:00 – 22:00'},
      {o:'Roomservice',d:'MO – SU',h:'24h (06:00 – 23:00 Restaurant-Team / 23:00 – 06:00 Rezeption)'},
      {o:'Bar',d:'MO – SU',h:'12:00 – 00:00'},
      {o:'Meeting & Event',d:'MO – SU',h:'Laut Buchung'},
      {o:'SPA Bistro',d:'MO – SU',h:'10:00 – 18:00'}]:[{o:'Restaurant',d:'MO – SU',h:''}],
    emp:defaultEmp(),
    year:{ops:365,ph:9,sick:5,off:104,hol:25,weeks:52,fteWeek:40},
    brk:brkPreset(opt.country||'AT'),lvl:{...LVL_DEF},
    hk:{auto:!!fromTpl,rooms:fromTpl?186:100,occ:.75,per:14,emp:'ext',start:480,d:null,f:0,dep:null},
    divs:[]};
  for(const k of ['ops','ph','sick','off','hol'])if(opt[k]!=null&&!isNaN(opt[k]))p.year[k]=+opt[k];
  if(opt.rooms!=null&&!isNaN(opt.rooms))p.hk.rooms=+opt.rooms;
  const P=(t,e,s,l)=>({id:uid(),t,e:roleOf(e),s,l:l===undefined?1:l,f:defF(roleOf(e)),d:OLD_NET[e]&&OLD_NET[e]!==8?durForNet(p,OLD_NET[e]):null});
  if(fromTpl){
    p.divs=TPL.map(dv=>({id:uid(),name:dv.name,deps:dv.deps.map(d=>{
      const dep={id:uid(),name:d.name,pos:d.pos.map(x=>P(x[0],x[1],x[2],x.length>3?x[3]:1))};
      if(/HOUSEKEEPING/i.test(d.name))p.hk.dep=dep.id;return dep})}));
    p.ops=p.ops.map(toOutlet);
    const link={'RESTAURANT':'Main Restaurant','BAR | GROUND FLOOR':'Bar','MEETING & EVENT':'Meeting & Event','MEETING & EVENT KITCHEN':'Meeting & Event'};
    for(const dv of p.divs)for(const d of dv.deps){const o=p.ops.find(x=>x.o===link[d.name]);if(o)d.outlet=o.id}
  }else{
    p.ops=p.ops.map(toOutlet);
    p.divs=[{id:uid(),name:'Rooms',deps:[{id:uid(),name:'Rezeption',pos:[P('Front Office Manager','mgnt',540),P('Front Office Agent','ft',420),P('Front Office Agent','ft',900),P('Night Auditor','ft',1380)]}]}];
  }
  return p;
}
/* ältere Projektstände (Mgnt-Auswahl je Abteilung) auf den FTE-Haken je Position umstellen */
function normalize(p){
  if(!p||!p.divs)return p;
  if(!p.brk||!p.brk.tiers)p.brk=brkPreset('AT');
  p.lvl=Object.assign({...LVL_DEF},p.lvl||{});
  const old=p.emp||{};
  if(old.ft||!old.staff){ /* Anstellungsarten → Rollen; Schichtlänge der alten Art bleibt erhalten */
    const net=k=>+((old[k]||{}).net)||OLD_NET[k]||8;
    for(const dv of p.divs)for(const d of dv.deps)for(const pos of d.pos){
      if(OLD_NET[pos.e]){if(pos.d==null&&net(pos.e)!==net('ft'))pos.d=durForNet(p,net(pos.e));pos.e='staff'}}
    if(OLD_NET[p.hk&&p.hk.emp]){if(p.hk.d==null&&net(p.hk.emp)!==net('ft'))p.hk.d=durForNet(p,net(p.hk.emp));p.hk.emp='staff'}
    p.emp={mgnt:{label:(old.mgnt&&old.mgnt.label)||'Management',net:+(old.mgnt&&old.mgnt.net)||8},staff:{label:'Mitarbeiter',net:net('ft')},ext:{label:(old.ext&&old.ext.label)||'Fremdfirma',net:+(old.ext&&old.ext.net)||8}};
  }
  for(const k of EMP_KEYS){p.emp[k]=p.emp[k]||defaultEmp()[k]}
  p.ops=(p.ops||[]).map(toOutlet);
  if(!(+p.emp.ext.net))p.emp.ext.net=8;
  p.hk=Object.assign({auto:false,rooms:100,occ:.75,per:14,emp:'ext',start:480,d:null,f:0,dep:null},p.hk||{});
  for(const dv of p.divs)for(const d of dv.deps){
    const scale=d.mgnt==='scale'||(d.mgnt!=='fix'&&p.mgntScale);
    for(const pos of d.pos){
      if(pos.f===undefined)pos.f=pos.e==='mgnt'?(scale?1:0):defF(pos.e);
      if(pos.d===undefined)pos.d=null;
    }
    delete d.mgnt;
  }
  delete p.mgntScale;p.v=2;return p;
}

/* ---------- calculation ---------- */
function hkCount(p){return Math.ceil((+p.hk.rooms||0)*(+p.hk.occ||0)/Math.max(+p.hk.per||1,0.0001)-1e-9)}
function hkPos(p){return {id:'hk',t:'Zimmermädchen (Rooms)',e:p.hk.emp,s:+p.hk.start,d:p.hk.d,f:p.hk.f?1:0,l:1,auto:true}}
function deptPositions(p,d){
  const list=d.pos.slice();
  if(p.hk.auto&&p.hk.dep===d.id){const n=hkCount(p),h=hkPos(p);for(let i=0;i<n;i++)list.push({...h,id:'hk'+i})}
  return list;
}
function workDays(p){const y=p.year;return y.ops-y.ph-y.sick-y.off-y.hol}
/* geforderte Pause (Min.) für eine Arbeitszeit in Stunden */
function reqBreak(p,wh){const b=p.brk;let m=0;for(const t of b.tiers){const h=+t.h||0;if(b.op==='>='?wh>=h-1e-9:wh>h+1e-9)m=Math.max(m,+t.m||0)}return m}
/* Pause innerhalb einer Präsenz von P Minuten: kleinste Pause, mit der die verbleibende Arbeitszeit gesetzeskonform ist */
function breakMin(p,P){
  if(p.brk.paid)return reqBreak(p,P/60);
  const cands=[0,...p.brk.tiers.map(t=>+t.m||0)].sort((a,b)=>a-b);
  for(const b of cands){if(b<P&&reqBreak(p,(P-b)/60)<=b)return b}
  return Math.max(...cands);
}
function durForNet(p,h){const net=(+h||0)*60;const P=p.brk.paid?net:net+reqBreak(p,net/60);return Math.max(SNAP,Math.ceil(P/SNAP-1e-9)*SNAP)}
function defDur(p,e){return durForNet(p,p.emp[e].net)}
/* Beschäftigungsausmaß: Arbeitszeit/Tag ÷ (FTE-Basis ÷ 5 Tage) */
const dayBase=p=>(+p.year.fteWeek||40)/5;
function pct(p,pos){return pos.e==='ext'?0:netH(p,pos)/dayBase(p)}
function catOf(p,pos){if(pos.e==='ext')return 'ext';if(pos.e==='mgnt')return 'mgnt';const q=pct(p,pos)*100+1e-6;return q>=p.lvl.full?'ft':q>=p.lvl.part?'pt':'ptr'}
function lvlLabel(p,pos){if(pos.e==='ext')return 'Fremdfirma';const q=pct(p,pos)*100+1e-6,c=q>=p.lvl.full?'Vollzeit':q>=p.lvl.part?'Teilzeit':'Part Timer';return `${fmtPct(pct(p,pos))} ${c}`}
const fmtPct=x=>(Math.round(x*1000)/10).toLocaleString('de-AT',{maximumFractionDigits:1})+' %';
function dur(p,pos){return pos.d!=null?pos.d:defDur(p,pos.e)}
function brkOf(p,pos){return breakMin(p,dur(p,pos))}
function netH(p,pos){const P=dur(p,pos);return p.brk.paid?P/60:Math.max(0,(P-breakMin(p,P))/60)}
const days=pos=>pos.f?7:5;
function onDuty(p,pos,slot){const s=pos.s,end=s+dur(p,pos);return (slot>=s&&slot<end)||(end>1440&&slot<end-1440)}
function calc(p){
  const y=p.year,wd=workDays(p),res={deps:{},divs:{}};
  const blank=()=>({heads:0,ext:0,d5:0,d7:0,ideal:0,hrs:0,fte:0,lock:0,byEmp:{mgnt:0,ft:0,pt:0,ptr:0,ext:0},byRole:{mgnt:0,staff:0}});
  const add=(A,B)=>{for(const k of ['heads','ext','d5','d7','ideal','hrs','fte','lock'])A[k]+=B[k];for(const k of CATS)A.byEmp[k]+=B.byEmp[k];A.byRole.mgnt+=B.byRole.mgnt;A.byRole.staff+=B.byRole.staff};
  const T=blank(),fteBase=(+y.fteWeek||40)*(+y.weeks||52);
  for(const dv of p.divs){const D=blank();
    for(const d of dv.deps){const R=blank();
      for(const pos of deptPositions(p,d)){
        R.byEmp[catOf(p,pos)]++;if(pos.l)R.lock++;
        if(pos.e==='ext'){R.ext++;continue}
        R.heads++;const v=pct(p,pos);R.byRole[pos.e]+=v;
        if(pos.f)R.d7+=v;else R.d5+=v;
        R.hrs+=netH(p,pos)*days(pos)*(+y.weeks);
      }
      R.ideal=R.d5+(wd>0?R.d7*y.ops/wd:0);
      R.fte=fteBase?R.hrs/fteBase:0;
      res.deps[d.id]=R;add(D,R);
    }
    res.divs[dv.id]=D;add(T,D);
  }
  res.tot=T;res.wd=wd;return res;
}
function coverage(p,filterDiv,incExt){
  const out=TIMES.map(()=>({n:0,mgnt:0,ft:0,pt:0,ptr:0,ext:0}));
  for(const dv of p.divs){if(filterDiv&&filterDiv!==dv.id)continue;
    for(const d of dv.deps)for(const pos of deptPositions(p,d)){
      if(pos.e==='ext'&&!incExt)continue;
      const c=catOf(p,pos);TIMES.forEach((t,i)=>{if(onDuty(p,pos,t)){out[i].n++;out[i][c]++}})}}
  return out;
}

/* ---------- Abdeckung der Öffnungszeiten ---------- */
const Q=15;
function openSlots(o,day){const d=o.days[day],set=new Array(96).fill(false);if(!d.on)return set;
  for(const w of d.w){const a=w[0],e=a+winLen(w);for(let t=a;t<e;t+=Q)set[(t%1440)/Q|0]=true}return set}
function outletOf(d){return d&&d.outlet?(cur.ops||[]).find(x=>x.id===d.outlet):null}
/* Lücken = Zeiten, in denen das Outlet geöffnet ist, aber niemand aus der Abteilung im Dienst ist */
function gapsFor(d,day){
  const o=outletOf(d);if(!o)return null;const open=openSlots(o,day);
  const staff=deptPositions(cur,d);const out=[];let st=-1;
  for(let i=0;i<=96;i++){
    const gap=i<96&&open[i]&&!staff.some(p=>onDuty(cur,p,i*Q));
    if(gap&&st<0)st=i;if(!gap&&st>=0){out.push([st*Q,i*Q]);st=-1}
  }
  return out;
}
const gapMin=g=>g.reduce((s,x)=>s+x[1]-x[0],0);
const fmtDur=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} h`;
function gapChip(d){
  const o=outletOf(d);if(!o)return '';
  const g=gapsFor(d,ui.refDay),all=DAYS.map((_,j)=>gapsFor(d,j));const bad=all.filter(x=>x.length).length;
  if(!o.days[ui.refDay].on)return `<span class="gchip off">${DAYS[ui.refDay]}: geschlossen</span>`;
  if(!g.length)return `<span class="gchip ok" title="${esc(o.o)}: alle Öffnungszeiten am ${DAYS_L[ui.refDay]} besetzt${bad?` · Lücken an ${bad} anderen Tag(en)`:''}">✓ ${DAYS[ui.refDay]} abgedeckt${bad?` · ${bad} Tag(e) mit Lücken`:''}</span>`;
  return `<span class="gchip gap" title="Nicht besetzt am ${DAYS_L[ui.refDay]}: ${g.map(x=>hhmm(x[0])+'–'+hhmm(x[1])).join(', ')}">⚠ ${DAYS[ui.refDay]}: ${g.length} Lücke${g.length>1?'n':''} · ${fmtDur(gapMin(g))}</span>`;
}
function openRow(d){

  const segs=day.on?day.w.flatMap(w=>{const a=w[0],e=a+winLen(w);return e>1440?[[a,1440],[0,e-1440]]:[[a,e]]}):[];
  return `<td colspan="8" class="orow-l"><span>Öffnungszeiten ${esc(o.o)}</span><span class="dots">${DAYS.map((n,j)=>{const gg=gapsFor(d,j),on=o.days[j].on;return `<button class="dot ${!on?'off':gg.length?'gap':'ok'} ${j===ui.refDay?'sel':''}" data-act="setDay" data-day="${j}" title="${DAYS_L[j]}: ${!on?'geschlossen':gg.length?'Lücken '+gg.map(x=>hhmm(x[0])+'–'+hhmm(x[1])).join(', '):'abgedeckt'}">${n}</button>`}).join('')}</span></td>
   <td><div class="otl2">${day.on?'':'<span class="closed-all">geschlossen</span>'}${segs.map(([a,b])=>`<span class="op" style="left:${a/14.4}%;width:${(b-a)/14.4}%"></span>`).join('')}${g.map(([a,b])=>`<span class="gp" style="left:${a/14.4}%;width:${(b-a)/14.4}%" title="nicht besetzt ${hhmm(a)}–${hhmm(b)}"></span>`).join('')}</div></td><td></td>`;

let drag=null;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.tl .b');if(!b||!cur||e.button>0)return;
  const tl=b.closest('.tl'),tr=tl.closest('tr');const tg=rowTarget(tr);if(!tg)return;
  const mode=e.target.classList.contains('hl')?'start':e.target.classList.contains('hr')?'end':'move';
  drag={tl,tr,tg,mode,x0:e.clientX,w:tl.getBoundingClientRect().width,s0:tg.pos.s,d0:dur(cur,tg.pos),moved:false};
  try{tl.setPointerCapture(e.pointerId)}catch(_){}
  tl.classList.add('dragging');document.body.classList.add('is-dragging');e.preventDefault();
  showDragTip();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const delta=Math.round((e.clientX-drag.x0)/drag.w*1440/SNAP)*SNAP;
  let s=drag.s0,d=drag.d0;
  if(drag.mode==='move')s=mod(drag.s0+delta);
  else if(drag.mode==='end')d=Math.min(1440,Math.max(SNAP,drag.d0+delta));
  else{d=Math.min(1440,Math.max(SNAP,drag.d0-delta));s=mod(drag.s0+(drag.d0-d))}
  if(s===drag.tg.pos.s&&d===dur(cur,drag.tg.pos))return;
  drag.moved=true;drag.tg.apply(s,d);refreshRow(drag.tr,drag.tg.pos);drag.tr.querySelector('.tl').classList.add('dragging');showDragTip();
});

function drawCov(){
  const svg=$('#covChart');if(!svg)return;
  const c=coverage(cur,ui.covDiv,ui.covExt);
  const W=960,H=280,L=40,Rr=14,Tp=22,B=30,pw=W-L-Rr,ph=H-Tp-B;
  const mx=Math.max(1,...c.map(x=>x.n));const step=mx<=10?2:mx<=25?5:mx<=60?10:mx<=150?25:50;const top=Math.ceil(mx/step)*step;
  const X=i=>L+i*pw/48,Y=v=>Tp+ph-(v/top)*ph;
  let g='';
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="Jost,Futura,sans-serif">${v}</text>`;
  for(let h=0;h<=24;h+=3)g+=`<text x="${X(h*2)}" y="${H-10}" text-anchor="${h===0?'start':h===24?'end':'middle'}" font-size="11" fill="var(--ink-3)" font-family="Jost,Futura,sans-serif">${String(h).padStart(2,'0')}:00</text>`;
  let d=`M${X(0)},${Y(0)}`;c.forEach((x,i)=>{d+=` L${X(i)},${Y(x.n)} L${X(i+1)},${Y(x.n)}`});d+=` L${X(48)},${Y(0)} Z`;
  let line='';c.forEach((x,i)=>{line+=(i?` L${X(i)},${Y(x.n)}`:`M${X(0)},${Y(x.n)}`)+` L${X(i+1)},${Y(x.n)}`});
  let pk=0;c.forEach((x,i)=>{if(x.n>c[pk].n)pk=i});
  const px=(X(pk)+X(pk+1))/2,py=Y(c[pk].n);
  g+=`<path d="${d}" fill="var(--terra)" fill-opacity=".18"/><path d="${line}" fill="none" stroke="var(--terra)" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<circle cx="${px}" cy="${py}" r="4" fill="var(--terra)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(Math.max(px,L+60),W-70)}" y="${py-9}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="Montserrat,sans-serif" font-weight="600">Spitze ${c[pk].n} MA · ${hhmm(TIMES[pk])}</text>`;
  g+=`<line id="covCross" x1="0" x2="0" y1="${Tp}" y2="${Tp+ph}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect id="covHit" x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="transparent"/>`;
  svg.innerHTML=g;
  const hit=svg.querySelector('#covHit'),tip=$('#covTip'),cross=svg.querySelector('#covCross');
  hit.addEventListener('pointermove',ev=>{const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)/r.width*W;let i=Math.floor((sx-L)/pw*48);i=Math.max(0,Math.min(47,i));const x=c[i];
    cross.setAttribute('x1',X(i)+pw/96);cross.setAttribute('x2',X(i)+pw/96);cross.setAttribute('visibility','visible');
    tip.hidden=false;tip.style.left=((X(i)+pw/96)/W*r.width)+'px';tip.style.top=(Y(x.n)/H*r.height)+'px';
    tip.innerHTML=`${hhmm(TIMES[i])} – ${hhmm(TIMES[i]+30)}<br><b>${x.n}</b> MA anwesend<br>${CATS.filter(k=>x[k]).map(k=>CAT_L[k]+' '+x[k]).join(' · ')}`});
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')});
}

/* ---------- method ---------- */
function renderMethod(R){
  const y=cur.year,wd=R.wd;
  return `<div class="method">
  <section><h3>Grundidee</h3><p>Der Tagesdienstplan beschreibt einen typischen Betriebstag: welche Position wann im Dienst ist. Daraus rechnet das Tool den Personalbedarf für ein ganzes Jahr hoch, auf zwei Wegen: über Arbeitstage (IDEAL) und über Arbeitsstunden (FTE).</p></section>
  <section><h3>Schichten und Pausen</h3><p>Beginn und Ende jeder Schicht lassen sich im Zeitstrahl ziehen oder über die Auswahlfelder setzen (15-Minuten-Raster).</p><p>Pausenregel: <code>${brkName()}</code>. Eine Pause wird nur abgezogen, wenn die Arbeitszeit die gesetzliche Schwelle überschreitet${cur.brk.paid?'; sie zählt hier als Arbeitszeit':''}. Stufen: ${cur.brk.tiers.map(t=>`${cur.brk.op==='>='?'ab':'mehr als'} ${fmt1(t.h)} Std → ${t.m} Min.`).join(' · ')}.</p></section>
  <section><h3>FTE-Haken je Position</h3><p>Leer: Die Position ist an 5 Tagen pro Woche besetzt und zählt 1 : 1, ohne Vertretung (typisch Management und Verwaltung).</p><p>Angeklickt: Die Position muss an 7 Tagen pro Woche besetzt sein. Der Bedarf wird über die Arbeitstage hochgerechnet, inklusive Vertretung für Urlaub, Frei, Feiertage und Krankheit.</p></section>
  <section><h3>Heads</h3><p>Anzahl der intern besetzten Schichten pro Tag. Fremdfirmen (z. B. Zimmerreinigung, Stewarding) zählen nicht mit: <code>${fmt0(R.tot.heads)} Heads</code></p></section>
  <section><h3>IDEAL · Jahresbedarf über Arbeitstage</h3><ol>
   <li>Jede interne Position zählt mit ihrem Beschäftigungsausmaß: Arbeitszeit pro Tag ÷ <code>${fmt1(dayBase(cur))} h</code> (z. B. 8 h = 100 % Vollzeit, 6 h = 75 % Teilzeit, 3 h = 37,5 % Part Timer). Vollzeit ab ${cur.lvl.full} %, Teilzeit ab ${cur.lvl.part} %, darunter Part Timer.</li>
   <li>Arbeitstage je Mitarbeiter = Betriebstage − Feiertage − Krankheit − freie Tage − Urlaub: <code>${wdText(y)} = ${wd}</code></li>
   <li>5-Tage-Positionen zählen mit ihrem Wert: <code>${fmt2(R.tot.d5)}</code></li>
   <li>7-Tage-Positionen = Wert × ${y.ops} Betriebstage ÷ ${wd} Arbeitstage (Faktor <code>${wd?fmt2(y.ops/wd):'–'}</code>): <code>${fmt2(R.tot.d7)} × ${wd?fmt2(y.ops/wd):'–'} = ${wd?fmt2(R.tot.d7*y.ops/wd):'–'}</code></li>
   <li>IDEAL = Summe aller Abteilungen: <code>${fmt2(R.tot.ideal)}</code></li></ol></section>
  <section><h3>FTE · Jahresbedarf über Stunden</h3><ol>
   <li>Stunden je Position und Woche = Arbeitsstunden der Schicht (nach Pausenregel) × 5 oder 7 Tage (FTE-Haken).</li>
   <li>Stunden je Jahr = Wochenstunden × ${y.weeks} Wochen.</li>
   <li>FTE = Jahresstunden ÷ (${y.fteWeek} Std × ${y.weeks} Wochen = ${fmt0(y.fteWeek*y.weeks)} Std): <code>${fmt2(R.tot.fte)}</code></li></ol>
   <p>FTE berücksichtigt keine Abwesenheiten. Die Differenz zu IDEAL zeigt, wie viel Puffer für Urlaub, Frei und Krankheit nötig ist.</p></section>
  <section><h3>Spinde</h3><p>Alle Positionen mit Spind-Haken, also interne Mitarbeiter ohne Executive-Team plus Fremdfirmen: <code>${fmt0(R.tot.lock)}</code></p></section>
  <section><h3>Housekeeping</h3><p>Zimmermädchen = Zimmer × Auslastung ÷ Zimmer je Mitarbeiter, aufgerundet: <code>${cur.hk.rooms} × ${Math.round(cur.hk.occ*100)} % ÷ ${cur.hk.per} → ${hkCount(cur)}</code>${cur.hk.auto?'':' (derzeit ausgeschaltet)'}</p></section>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;try{history.replaceState(null,'','#'+ui.tab)}catch(_){}render();return}
  if(t.classList.contains('chip')){ui.div=t.dataset.div;renderView();return}
  const a=t.dataset.act;if(!a)return;
  if(a==='openNew')return openNew();
  if(a==='import')return $('#fileImport').click();
  if(!cur)return;
  if(a==='setDay'){ui.refDay=+t.dataset.day;renderView();return}
  if(a==='ovJump'){ui.refDay=+t.dataset.day;ui.div=t.dataset.div;renderView();return}
  if(a==='goParams'){ui.tab='parameter';render();return}
  if(a==='cancelDel'){ui.confirmDel=null;renderView();return}
  if(a==='addTier'){const l=cur.brk.tiers[cur.brk.tiers.length-1];cur.brk.tiers.push({h:l?l.h+3:6,m:l?l.m+15:30});cur.brk.country='custom';touch();render();return}
  if(a==='delTier'){cur.brk.tiers.splice(+t.dataset.i,1);cur.brk.country='custom';touch();render();return}
  if(a==='addOp'){
    const used=new Set(cur.ops.map(o=>o.o));let n=1,name='Neues Outlet';while(used.has(name))name='Neues Outlet '+(++n);
    const o={id:uid(),o:name,note:'',days:DAYS.map(()=>({on:1,w:[[660,1320]]}))};cur.ops.push(o);
    /* passender Bereich mit gleichnamiger Abteilung im Dienstplan, mit dem Outlet verknüpft */
    cur.divs.push({id:uid(),name,outlet:o.id,deps:[{id:uid(),name,outlet:o.id,pos:[]}]});
    touch();renderView();refreshKpis();toast('Outlet und Bereich „'+name+'“ im Dienstplan angelegt');
    const inp=document.querySelector(`.outlet:last-of-type .ol-name`);if(inp){inp.focus();inp.select()}return}
  if(a==='mkDiv'){const o=cur.ops.find(x=>x.id===t.dataset.id);cur.divs.push({id:uid(),name:o.o,outlet:o.id,deps:[{id:uid(),name:o.o,outlet:o.id,pos:[]}]});touch();renderView();toast('Bereich „'+o.o+'“ im Dienstplan angelegt');return}
  if(a==='goOutlet'){const dv=cur.divs.find(x=>x.outlet===t.dataset.id)||cur.divs.find(x=>x.deps.some(d=>d.outlet===t.dataset.id));ui.tab='dienstplan';ui.div=dv?dv.id:'';try{history.replaceState(null,'','#dienstplan')}catch(_){}render();window.scrollTo({top:document.querySelector('.tabs').getBoundingClientRect().top+window.scrollY-10});return}
  if(a==='delOp'){ui.confirmDel='op:'+cur.ops[+t.dataset.oo].id;renderView();return}
  if(a==='delOpYes'){const o=cur.ops.splice(+t.dataset.oo,1)[0];for(const dv of cur.divs){if(dv.outlet===o.id)delete dv.outlet;for(const d of dv.deps)if(d.outlet===o.id)delete d.outlet}ui.confirmDel=null;touch();renderView();return}
  if(a==='addWin'){const d=cur.ops[+t.dataset.oo].days[+t.dataset.od];const l=d.w[d.w.length-1];let a0=l?Math.min(1380,l[1]%1440+60):660;d.w.push([a0,Math.min(1440,a0+180)]);touch();renderView();return}
  if(a==='delWin'){cur.ops[+t.dataset.oo].days[+t.dataset.od].w.splice(+t.dataset.ow,1);touch();renderView();return}
  if(a==='copyMon'||a==='copyWd'){const o=cur.ops[+t.dataset.oo];const m=o.days[0];for(let j=1;j<(a==='copyMon'?7:5);j++)o.days[j]={on:m.on,w:m.w.map(w=>[...w])};touch();renderView();toast(a==='copyMon'?'Montag auf alle Tage übertragen':'Montag auf Di – Fr übertragen');return}
  if(a==='addDiv'){const n=($('#newDivName').value||'').trim()||'Neuer Bereich';cur.divs.push({id:uid(),name:n,deps:[{id:uid(),name:'Neue Abteilung',pos:[]}]});touch();render();return}
  if(a==='addDep'){const dv=cur.divs.find(x=>x.id===t.dataset.div);dv.deps.push({id:uid(),name:'Neue Abteilung',pos:[{id:uid(),t:'Neue Position',e:'staff',s:540,l:1,f:1,d:null}]});touch();renderView();refreshKpis();return}

  if(a==='delDepYes'){for(const dv of cur.divs){dv.deps=dv.deps.filter(d=>d.id!==t.dataset.dep)}cur.divs=cur.divs.filter(dv=>dv.deps.length);if(cur.hk.dep===t.dataset.dep)cur.hk.dep=null;ui.confirmDel=null;touch();render();return}

async function importExcel(file){
  if(!window.XLSX)throw new Error('Excel-Bibliothek nicht geladen');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets['Daily Schedule'];if(!ws)throw new Error('Blatt „Daily Schedule“ nicht gefunden – bitte die Manning-Guide-Vorlage verwenden.');
  const v=a=>{const c=ws[a];return c?c.v:undefined};
  const p=newProject(false);p.divs=[];p.ops=[];
  p.name=String(v('D1')||file.name.replace(/\.[^.]+$/,'')).trim();
  const xnet={mgnt:8,ft:8,pt:4,ptr:3};for(const [k,r] of [['mgnt',16],['ft',17],['pt',18],['ptr',19]]){if(typeof v('D'+r)==='number')xnet[k]=v('D'+r)}p.emp.mgnt.net=xnet.mgnt;p.emp.staff.net=xnet.ft;
  const yr={ops:'I16',ph:'I17',sick:'I18',off:'I19',hol:'I20'};for(const k in yr)if(typeof v(yr[k])==='number')p.year[k]=v(yr[k]);
  if(typeof v('D23')==='number'){p.hk.rooms=v('D23');p.hk.occ=+v('D24')||.75;p.hk.per=+v('D25')||14}
  for(let r=9;r<=13;r++){const o=v('C'+r);if(o&&typeof o==='string'&&o.includes(':'))p.ops.push(toOutlet({o:o.replace(':','').trim(),h:String(v('E'+r)||'').replace(/^\|\s*/,'')}))}
  const ref=XLSX.utils.decode_range(ws['!ref']);let dv=null,dep=null;
  for(let r=29;r<=ref.e.r+1;r++){const A=v('A'+r),C=v('C'+r),D=v('D'+r);
    if(typeof A==='string'&&A.trim()&&A!=='Pos.'&&C===undefined&&/^[A-Z&| .]+$/i.test(A)&&!/TOTAL/i.test(A)){dv={id:uid(),name:A.trim(),deps:[]};p.divs.push(dv);dep=null;continue}
    if(A==='Pos.'&&C){if(!dv){dv={id:uid(),name:'Allgemein',deps:[]};p.divs.push(dv)}dep={id:uid(),name:String(C).trim(),pos:[]};dv.deps.push(dep);continue}
    if(dep&&C&&EMP_XLS[D]){const E=v('E'+r);const s=typeof E==='number'?Math.round((E%1)*1440/30)*30%1440:540;const B=+v('B'+r)||0;const e=EMP_XLS[D];
      const role=roleOf(e);dep.pos.push({id:uid(),t:String(C).trim(),e:role,s,l:B===-1?0:1,f:defF(role),d:role==='staff'&&xnet[e]!==xnet.ft?durForNet(p,xnet[e]):null})}
  }
  p.divs=p.divs.filter(d=>d.deps.length);
  if(!p.divs.length)throw new Error('Keine Positionen gefunden.');
  const hk=p.divs.flatMap(d=>d.deps).find(d=>/housekeeping/i.test(d.name));
  if(hk){p.hk.dep=hk.id;p.hk.auto=false}
  return p;
}

    if(yc[col]+need>H-18){col++;if(col>1){newPage();col=0;yc=[26,26]}}
    const x=M+col*(colW+12);draw(C.line);doc.setLineWidth(0.25);doc.line(x,yc[col]-3,x,yc[col]+need-6);
    font(8.5,'bold');ink(C.ink);doc.setCharSpace(0.3);txt(h.toUpperCase(),x+4,yc[col]);doc.setCharSpace(0);font(8);ink(C.ink2);doc.text(lines,x+4,yc[col]+5);yc[col]+=need+2}

  /* --- Kopf- und Fußzeile --- */
  const n=doc.getNumberOfPages();
  for(let i=2;i<=n;i++){doc.setPage(i);
    if(logo)doc.addImage(logo,'PNG',M,10,24,3.9);draw(C.line);doc.setLineWidth(0.2);doc.line(M+27.5,9.5,M+27.5,14.5);
    font(7.5);ink(C.ink);doc.setCharSpace(0.8);txt('MANNING GUIDE',M+31,13.6);doc.setCharSpace(0);
    font(7.5);ink(C.ink2);txt(`${cur.name} · ${cur.status}`,W-M,13.6,{align:'right'});
    draw(C.hair);doc.setLineWidth(0.2);doc.line(M,18,W-M,18);doc.line(M,H-11,W-M,H-11);
    font(6.5);ink(C.ink3);txt('mamu hospitality · Schönbrunner Straße 179 · AT-1120 Vienna',M,H-6.5);txt(`${dateStr} · Seite ${i} / ${n}`,W-M,H-6.5,{align:'right'})}
  return doc.output('blob');
}

/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude?await claude.use('db').catch(()=>null):null;
  booting=false;
  if(!c){localMode=true;let all=null,last='';
    try{all=JSON.parse(localStorage.getItem('mg-projects')||'null')}catch(e){}
    if(!all||!Object.keys(all).length){let p=null;try{p=JSON.parse(localStorage.getItem('mg-local')||'null')}catch(e){}p=p&&p.divs?p:newProject(true);all={[p.id]:p}}
    for(const k in all)all[k]=normalize(all[k]);projects=all;
    try{last=localStorage.getItem('mg-cur')||''}catch(e){}
    cur=projects[last]||Object.values(projects).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];localSave();
    setStatus('saved','Im Browser gespeichert');$('#btnBackup').hidden=false;render();return}
  db=c;setStatus('idle','Verbunden');
  let first=true,last='';try{last=localStorage.getItem('mg-cur')||''}catch(e){}
  db.collection('projects').onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.divs)next[d.id]=normalize({...JSON.parse(JSON.stringify(x)),id:d.id})});
    if(cur&&!next[cur.id]&&(dirty||saving))next[cur.id]=cur;
    if(cur&&next[cur.id]){
      if(drag||dirty||saving||(next[cur.id].updatedAt||0)<=(cur.updatedAt||0))next[cur.id]=cur;
      else{cur=next[cur.id];projects=next;render();return}
    }
    projects=next;
    if(first){first=false;cur=projects[last]||Object.values(projects).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0]||null;setStatus('saved',Object.keys(projects).length?'Gespeichert':'Bereit');render();return}
    if(cur&&!projects[cur.id])cur=Object.values(projects)[0]||null;
    if(!cur&&Object.keys(projects).length){cur=Object.values(projects).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];render();return}
    renderProjSel();if(!cur)render();
  },()=>{setStatus('error','Speicher nicht erreichbar');localMode=true;if(!cur){cur=newProject(true);projects={[cur.id]:cur}}render()});
})();
</script>
